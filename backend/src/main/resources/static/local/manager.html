<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ローカル入場受付 | Recycle Gang</title>
<style>body{font:16px/1.7 system-ui,sans-serif;background:#f4f8f4;color:#17362b;margin:0;padding:24px}main{max-width:600px;margin:auto;background:white;padding:28px;border-radius:24px}h1{font-size:26px;margin:0}label{display:block;margin:20px 0 4px}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;border-radius:10px;padding:12px;border:1px solid #b7cfc2}button{cursor:pointer;background:#15775a;color:white;margin-top:14px}button:disabled{opacity:.5}video{width:100%;max-height:340px;border-radius:12px;margin-top:12px}#result{white-space:pre-wrap;padding:16px;border-radius:12px;background:#edf4ee}small{color:#587367}</style>
<main><small>RECYCLE GANG / LOCAL v0.1</small><h1>施設の入場受付</h1><p>東エリア リサイクルステーションの管理人用テスト画面です。ユーザーのQRを読み取るか、コピーしたコードを貼り付けて受付します。</p>
<label for="auth">ローカル管理人トークン</label><input id="auth" type="password" value="local-manager-demo" autocomplete="off">
<button id="camera" type="button">カメラでQRを読み取る</button><video id="video" muted playsinline hidden></video><button id="stop" hidden>カメラを停止</button><canvas id="canvas" hidden></canvas>
<label for="ticket">入場用コード</label><textarea id="ticket" rows="3" placeholder="rg:entry:v1:..." autocomplete="off"></textarea><button id="admit">この予約の入場を記録する</button><p id="result" role="status">受付待ち</p><small>カメラの利用にはブラウザーの許可が必要です。コードを読み取った後、受付ボタンを押すと入場記録が保存されます。退場時の操作は不要です。</small></main>
<script src="/local/vendor/jsQR.js"></script><script>
const $=id=>document.getElementById(id);let stream=null,frame=null;
function stop(){if(frame)cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').hidden=true;$('stop').hidden=true;}
$('stop').onclick=stop;window.addEventListener('pagehide',stop);
$('camera').onclick=async()=>{stop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('video').srcObject=stream;$('video').hidden=false;$('stop').hidden=false;await $('video').play();scan();}catch(e){$('result').textContent='カメラを開けません。ブラウザーの許可を確認するか、コードを貼り付けてください。';stop();}};
function scan(){if(!stream)return;const video=$('video'),canvas=$('canvas');if(video.readyState>=2){const scale=Math.min(1,800/video.videoWidth);canvas.width=video.videoWidth*scale;canvas.height=video.videoHeight*scale;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,canvas.width,canvas.height);const image=ctx.getImageData(0,0,canvas.width,canvas.height);const qr=jsQR(image.data,image.width,image.height);if(qr){if(qr.data.startsWith('rg:entry:v1:')){$('ticket').value=qr.data;$('result').textContent='QRを読み取りました。入場を記録してください。';stop();return;}else{$('result').textContent='リサイクルギャングの入場用QRではありません。';}}}frame=requestAnimationFrame(scan);}
$('admit').onclick=async()=>{const token=$('ticket').value.trim();if(!/^rg:entry:v1:[A-Za-z0-9_-]{43}$/.test(token)){$('result').textContent='入場用コードを確認してください。';return;}$('admit').disabled=true;try{const res=await fetch('/api/backyard/v1/admissions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('auth').value},body:JSON.stringify({token})});const data=await res.json();if(!res.ok)throw new Error(data.message||'受付に失敗しました。');$('result').textContent=(data.alreadyAdmitted?'受付済みです。重複記録はしていません。':'入場を記録しました。')+'\n予約番号：'+data.reservationId+'\n受付日時：'+new Date(data.admittedAt).toLocaleString('ja-JP');$('ticket').value='';}catch(e){$('result').textContent=e.message||'サーバーに接続できません。';}finally{$('admit').disabled=false;}};
</script></html>
