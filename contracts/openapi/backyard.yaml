{
  "openapi": "3.0.3",
  "info": {
    "title": "Recycle Gang backyard API",
    "version": "0.1.0",
    "description": "Consumer and facility admission contract. Local demo credentials are restricted to the local Spring profile. Prices and payments are fixtures."
  },
  "servers": [
    {
      "url": "http://localhost:8080"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/backyard/v1/admissions": {
      "post": {
        "operationId": "admitReservation",
        "tags": [
          "Admissions"
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Admission"
                }
              }
            }
          },
          "default": {
            "description": "Business or validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AdmissionInput"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "$ref": "./shared.yaml#/components/schemas/Error"
      },
      "Facility": {
        "$ref": "./shared.yaml#/components/schemas/Facility"
      },
      "ItemType": {
        "$ref": "./shared.yaml#/components/schemas/ItemType"
      },
      "Slot": {
        "$ref": "./shared.yaml#/components/schemas/Slot"
      },
      "Catalog": {
        "$ref": "./shared.yaml#/components/schemas/Catalog"
      },
      "Address": {
        "$ref": "./shared.yaml#/components/schemas/Address"
      },
      "Profile": {
        "$ref": "./shared.yaml#/components/schemas/Profile"
      },
      "ItemInput": {
        "$ref": "./shared.yaml#/components/schemas/ItemInput"
      },
      "ReservationInput": {
        "$ref": "./shared.yaml#/components/schemas/ReservationInput"
      },
      "ReservationItem": {
        "$ref": "./shared.yaml#/components/schemas/ReservationItem"
      },
      "Photo": {
        "$ref": "./shared.yaml#/components/schemas/Photo"
      },
      "Reservation": {
        "$ref": "./shared.yaml#/components/schemas/Reservation"
      },
      "Ticket": {
        "$ref": "./shared.yaml#/components/schemas/Ticket"
      },
      "AdmissionInput": {
        "$ref": "./shared.yaml#/components/schemas/AdmissionInput"
      },
      "Admission": {
        "$ref": "./shared.yaml#/components/schemas/Admission"
      }
    }
  }
}
