{
  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ]
      },
      "Facility": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "latitude": {
            "type": "number",
            "format": "double"
          },
          "longitude": {
            "type": "number",
            "format": "double"
          },
          "instructions": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "name",
          "address",
          "latitude",
          "longitude",
          "instructions"
        ]
      },
      "ItemType": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "unit": {
            "type": "string"
          },
          "priceYen": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "id",
          "name",
          "unit",
          "priceYen"
        ]
      },
      "Slot": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "label": {
            "type": "string"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "label",
          "startsAt",
          "endsAt"
        ]
      },
      "Catalog": {
        "type": "object",
        "properties": {
          "facilities": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Facility"
            }
          },
          "itemTypes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ItemType"
            }
          },
          "slots": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Slot"
            }
          }
        },
        "required": [
          "facilities",
          "itemTypes",
          "slots"
        ]
      },
      "Address": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "label": {
            "type": "string",
            "maxLength": 40
          },
          "postalCode": {
            "type": "string",
            "maxLength": 10
          },
          "prefecture": {
            "type": "string",
            "maxLength": 10
          },
          "addressLine": {
            "type": "string",
            "maxLength": 200
          }
        },
        "required": [
          "id",
          "label",
          "postalCode",
          "prefecture",
          "addressLine"
        ]
      },
      "Profile": {
        "type": "object",
        "properties": {
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "email": {
            "type": "string",
            "maxLength": 200
          },
          "phone": {
            "type": "string",
            "maxLength": 30
          },
          "addresses": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Address"
            }
          }
        },
        "required": [
          "displayName",
          "email",
          "phone",
          "addresses"
        ]
      },
      "ItemInput": {
        "type": "object",
        "properties": {
          "itemTypeId": {
            "type": "string"
          },
          "quantity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 20
          }
        },
        "required": [
          "itemTypeId",
          "quantity"
        ]
      },
      "ReservationInput": {
        "type": "object",
        "properties": {
          "clientRequestId": {
            "type": "string",
            "format": "uuid"
          },
          "mode": {
            "type": "string",
            "enum": [
              "PICKUP",
              "DROPOFF"
            ]
          },
          "facilityId": {
            "type": "string"
          },
          "addressId": {
            "type": "string"
          },
          "slotId": {
            "type": "string"
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ItemInput"
            },
            "minItems": 1,
            "maxItems": 10
          },
          "note": {
            "type": "string",
            "maxLength": 500
          }
        },
        "required": [
          "clientRequestId",
          "mode",
          "slotId",
          "items"
        ]
      },
      "ReservationItem": {
        "type": "object",
        "properties": {
          "itemTypeId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "quantity": {
            "type": "integer"
          },
          "unitPriceYen": {
            "type": "integer"
          }
        },
        "required": [
          "itemTypeId",
          "name",
          "quantity",
          "unitPriceYen"
        ]
      },
      "Photo": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "fileName": {
            "type": "string"
          },
          "contentType": {
            "type": "string"
          },
          "size": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "id",
          "fileName",
          "contentType",
          "size"
        ]
      },
      "Reservation": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "mode": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "locationName": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "slotStart": {
            "type": "string",
            "format": "date-time"
          },
          "slotEnd": {
            "type": "string",
            "format": "date-time"
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ReservationItem"
            }
          },
          "amountYen": {
            "type": "integer"
          },
          "paymentStatus": {
            "type": "string"
          },
          "note": {
            "type": "string"
          },
          "photos": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Photo"
            }
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "admittedAt": {
            "type": "string",
            "format": "date-time"
          },
          "completedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "mode",
          "status",
          "locationName",
          "address",
          "slotStart",
          "slotEnd",
          "items",
          "amountYen",
          "paymentStatus",
          "note",
          "photos",
          "createdAt"
        ]
      },
      "Ticket": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "token",
          "expiresAt"
        ]
      },
      "AdmissionInput": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "minLength": 20,
            "maxLength": 200
          }
        },
        "required": [
          "token"
        ]
      },
      "Admission": {
        "type": "object",
        "properties": {
          "reservationId": {
            "type": "string"
          },
          "admittedAt": {
            "type": "string",
            "format": "date-time"
          },
          "alreadyAdmitted": {
            "type": "boolean"
          }
        },
        "required": [
          "reservationId",
          "admittedAt",
          "alreadyAdmitted"
        ]
      }
    }
  }
}
