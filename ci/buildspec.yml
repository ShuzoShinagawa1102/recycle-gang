# CodeBuild Linux standard image with JDK 21 and Docker privileged mode.
# Trigger/approval/role configuration belongs to CodePipeline; this file never deploys.
version: 0.2
env:
  variables:
    CI: "true"
    FLUTTER_SUPPRESS_ANALYTICS: "true"
    FLUTTER_VERSION: "3.47.6"
phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git /tmp/recycle-flutter
      - export PATH="/tmp/recycle-flutter/bin:$PATH"
      - flutter config --no-analytics
      - docker run -d --name rg-ci-db -e POSTGRES_DB=recycle_gang -e POSTGRES_USER=recycle_gang -e POSTGRES_PASSWORD=local-recycle-only -p 127.0.0.1:5432:5432 postgres:16.15
      - timeout 60 bash -c 'until docker exec rg-ci-db pg_isready -U recycle_gang -d recycle_gang; do sleep 2; done'
  build:
    commands:
      - bash backend/gradlew -p backend test databaseTest bootJar
      - cd flutter
      - flutter pub get
      - flutter analyze
      - flutter test --reporter expanded
      - flutter build web --dart-define=USE_MOCKS=true
      - cd ..
  post_build:
    commands:
      - docker stop rg-ci-db || true
reports:
  backend-tests:
    files:
      - "**/TEST-*.xml"
    base-directory: backend/build/test-results
    file-format: JUNITXML
artifacts:
  files:
    - backend/build/libs/*.jar
    - flutter/build/web/**/*
    - backend/build/reports/tests/**/*
