services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: recycle_gang
      POSTGRES_USER: recycle_gang
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-recycle-only}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recycle_gang -d recycle_gang"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
